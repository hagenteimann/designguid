name: Font submission
description: Submit a font from the FontGen studio to the public library (CC0)
title: "[Font] "
labels: ["font-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your font! This issue is created from the studio, please do not edit the data below.

        By submitting you release the font under **CC0 1.0** (public domain). The issue is public and shows your GitHub name.
        The maintainer reviews every submission; approved fonts appear in the library within a few minutes.
  - type: textarea
    id: submission
    attributes:
      label: Font data
      description: Design parameters generated by the studio.
      render: json
    validations:
      required: true
