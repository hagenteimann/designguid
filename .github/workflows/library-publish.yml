name: Publish font to library

# Publishes a font submission when (a) the maintainer adds the "approved" label, or
# (b) the issue was opened by the repository owner, a member or a collaborator (trusted, no review needed).
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: library-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'font-submission')) ||
      (github.event.action == 'opened' && startsWith(github.event.issue.title, '[Font]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./Projekt/fontgen-ai/frontend
        run: npm install

      - name: Validate submission and write library entry
        working-directory: ./Projekt/fontgen-ai/frontend
        run: |
          npx esbuild scripts/publish-font.ts --bundle --platform=node --format=cjs --outfile="$RUNNER_TEMP/publish.cjs" --log-level=warning
          node "$RUNNER_TEMP/publish.cjs"

      - name: Build download package and upload it to the library release
        working-directory: ./Projekt/fontgen-ai/frontend
        run: |
          npx esbuild scripts/make-family-zip.ts --bundle --platform=node --format=cjs --outfile="$RUNNER_TEMP/zip.cjs" --log-level=warning
          node "$RUNNER_TEMP/zip.cjs" "public/library/fonts/$ISSUE.json" "$RUNNER_TEMP/zips"
          gh release view library >/dev/null 2>&1 || gh release create library --title "Font library downloads" --notes "Download packages of the public font library (CC0). The download counts shown in the library come from these files." --latest=false
          for f in "$RUNNER_TEMP"/zips/*.zip; do
            if gh release view library --json assets -q '.assets[].name' | grep -qxF "$(basename "$f")"; then
              echo "$(basename "$f") already uploaded"
            else
              gh release upload library "$f"
            fi
          done

      - name: Commit entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Projekt/fontgen-ai/frontend/public/library/fonts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "library: add font from issue #$ISSUE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy site
        run: gh workflow run deploy.yml --ref main

      - name: Confirm and close issue
        run: |
          gh issue comment "$ISSUE" --body "Published. The font appears in the library after the next deploy (a few minutes). Thank you!"
          gh issue close "$ISSUE" --reason completed

      - name: Report failure
        if: failure()
        run: |
          gh issue comment "$ISSUE" --body "Publishing failed, the submission could not be validated or committed. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
