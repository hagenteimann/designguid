<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found – FontGen AI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }

      .container {
        text-align: center;
        max-width: 500px;
      }

      h1 {
        font-size: 4rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.125rem;
        margin-bottom: 2rem;
        opacity: 0.9;
      }

      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: #3b82f6;
        color: white;
        text-decoration: none;
        border-radius: 0.375rem;
        font-weight: 600;
        transition: background 0.2s;
      }

      a:hover {
        background: #2563eb;
      }

      small {
        display: block;
        margin-top: 2rem;
        opacity: 0.7;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <p>Page not found.</p>
      <p>The page you're looking for doesn't exist. If this is a FontGen AI feature, it should be available at the main app.</p>
      <a href="/designguid/">← Return to FontGen AI</a>
      <small>For SPA routing, this page redirects to the main app entry point.</small>
    </div>
    <script>
      // SPA routing: redirect to main app if not already there
      if (window.location.pathname !== '/designguid/') {
        window.location.href = '/designguid/';
      }
    </script>
  </body>
</html>
